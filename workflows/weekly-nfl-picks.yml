name: Weekly NFL Picks

# NFL weeks run Thu-Mon; adjust the cron day/time once you know when you
# want picks ready (e.g. Wednesday for full-week lookahead).
# Manual runs via the Actions tab are the primary path for now.
on:
  # schedule:
  #   - cron: '0 14 * * 3'   # Wednesday 14:00 UTC, example only -- currently off
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-nfl-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate this week's picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          mkdir -p picks
          python nfl_picks.py --record --log nfl_picks_log.csv --budget 3 --chalk-bias 0.60 \
            | tee "picks/$(date -u +%Y-%m-%d).md"

      - name: Commit results back to repo
        run: |
          git config user.name "nfl-picks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nfl_picks_log.csv picks/
          git diff --staged --quiet || git commit -m "Weekly picks: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
